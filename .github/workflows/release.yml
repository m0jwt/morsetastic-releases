name: Publish Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Verify packages
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/release.py verify "$RELEASE_TAG"
      - name: Upload and publish
        shell: bash
        run: |
          set -euo pipefail
          folder="releases/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Published releases are never overwritten"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Morsetastic V${RELEASE_TAG#v}" \
              --notes-file "$folder/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "$folder"/linux/*.zip "$folder"/windows/*.zip \
            "$folder/SHA256SUMS.txt" "$folder/release.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --notes-file "$folder/RELEASE_NOTES.md"
